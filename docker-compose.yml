services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: teme
            POSTGRES_USER: teme
            POSTGRES_PASSWORD: teme
        ports:
            - '${TEME_DB_PORT:-5432}:5432'
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U teme -d teme']
            interval: 5s
            timeout: 5s
            retries: 10

    postgres_test:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: teme_test
            POSTGRES_USER: teme
            POSTGRES_PASSWORD: teme
        ports:
            - '${TEME_TEST_DB_PORT:-5433}:5432'
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U teme -d teme_test']
            interval: 5s
            timeout: 5s
            retries: 10

    valkey_test:
        image: valkey/valkey:9.1-alpine
        ports:
            - '${TEME_VALKEY_TEST_PORT:-6380}:6379'
        tmpfs:
            - /data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
