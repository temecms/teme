# Teme's Compose recipe (I-384): one image, several roles, and the
# PostgreSQL they share. Put this file and the postgres folder on the
# server (the image carries both: docs/guides/operators/install.md copies
# them out with docker cp), and beside them:
#   .env     TEME_IMAGE, the image with its exact tag (never latest), and
#            APP_URL; then any of Teme's settings (the guide names them;
#            never copy .env.example, which is for development). Compose
#            reads it, and hands it to every Teme role.
#            Media in object storage takes MEDIA_STORAGE and the other
#            MEDIA_* settings from it too (object-storage.md).
#   secrets  app_key, db_password, postgres_password and github_token, one
#            value each (github_token may be empty), readable by the
#            containers (chmod 0644).
# No port is published: the platform's proxy reaches web on port 8080.
# Valkey, for the page cache only: --profile valkey and
# PAGE_CACHE_DRIVER=redis in .env.
name: teme

x-database: &database
    DB_DATABASE: teme
    DB_USERNAME: teme
    DB_PASSWORD_FILE: /run/secrets/db_password
    TEME_VERIFY_DATABASE: teme_verify

x-teme-environment: &teme-environment
    <<: *database
    APP_URL: "${APP_URL:?Set APP_URL in .env to the site's address, such as https://example.com}"
    APP_KEY_FILE: /run/secrets/app_key
    DB_HOST: postgres
    DB_PORT: '5432'
    PAGE_CACHE_DRIVER: '${PAGE_CACHE_DRIVER:-static}'
    REDIS_HOST: valkey
    # libpq gives up on an unreachable database after 3 s, so a health check
    # never holds a PHP worker for minutes.
    PGCONNECT_TIMEOUT: '3'
    TEME_EXTENSIONS_PATH: /var/teme/extensions

x-teme: &teme
    image: "${TEME_IMAGE:?Set TEME_IMAGE in .env to Teme's image and its exact tag, such as ghcr.io/example/teme:0.1.0}"
    env_file:
        - path: .env
          required: false
    environment: *teme-environment
    secrets:
        - app_key
        - db_password
    volumes:
        - media:/var/www/html/storage/app
        - page-cache:/var/www/html/storage/page-cache
        - extensions:/var/teme/extensions:ro
    restart: unless-stopped

services:
    # Migrates under a lock, backs up first when it must, then exits; every
    # other role waits for it.
    deploy:
        <<: *teme
        command: ['php', 'artisan', 'teme:deploy']
        init: true
        restart: 'no'
        healthcheck:
            disable: true
        depends_on:
            postgres:
                condition: service_healthy

    web:
        <<: *teme
        environment:
            <<: *teme-environment
            PHP_FPM_PM_MAX_CHILDREN: '${PHP_FPM_PM_MAX_CHILDREN:-10}'
        depends_on:
            deploy:
                condition: service_completed_successfully
            installer:
                condition: service_healthy

    worker:
        <<: *teme
        command:
            ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
        init: true
        stop_signal: SIGTERM
        stop_grace_period: 6m
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s
        depends_on:
            deploy:
                condition: service_completed_successfully
            installer:
                condition: service_healthy

    # The long jobs' own worker, on the long queue's own connection
    # (database-long, issue #146).
    worker-long:
        <<: *teme
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'database-long',
                '--queue=long',
                '--tries=3',
                '--max-time=3600',
            ]
        init: true
        stop_signal: SIGTERM
        stop_grace_period: 6m
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s
        depends_on:
            deploy:
                condition: service_completed_successfully
            installer:
                condition: service_healthy

    # Every timed job, backups among them: its grace period lets a backup
    # in progress finish.
    scheduler:
        <<: *teme
        command: ['php', 'artisan', 'schedule:work']
        init: true
        stop_signal: SIGTERM
        stop_grace_period: 30m
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s
        environment:
            <<: *teme-environment
            TEME_GITHUB_TOKEN_FILE: /run/secrets/github_token
        secrets:
            - app_key
            - db_password
            - github_token
        depends_on:
            deploy:
                condition: service_completed_successfully
            installer:
                condition: service_healthy

    # Installs, updates and removes the plugins and themes asked for from the
    # admin (docs/guides/operators/extensions.md): the only part that writes
    # the extensions volume. The others start once it has checked the
    # installed ones against this image.
    installer:
        <<: *teme
        user: '9990:9990'
        # The image's start step writes caches into storage/, which this user can't write; the installer needs none.
        entrypoint: ['php', 'artisan', 'teme:installer']
        init: true
        stop_grace_period: 2m
        environment:
            <<: *teme-environment
            TEME_EXTENSIONS_ROLE: installer
        volumes:
            - extensions:/var/teme/extensions
        healthcheck:
            test: ['CMD', 'test', '-f', '/tmp/teme-installer-ready']
            interval: 5s
            retries: 3
            start_period: 15m
        depends_on:
            deploy:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 1g }

    postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        environment:
            <<: *database
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
        secrets:
            - postgres_password
            - db_password
        configs:
            - source: teme-database
              target: /docker-entrypoint-initdb.d/10-teme-role.sh
              mode: 0555
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '--host',
                    '127.0.0.1',
                    '--username',
                    'postgres',
                    '--dbname',
                    'postgres',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        stop_grace_period: 1m
        restart: unless-stopped

    valkey:
        image: valkey/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        profiles: ['valkey']
        command:
            [
                'valkey-server',
                '--save',
                '',
                '--appendonly',
                'no',
                '--maxmemory',
                '256mb',
                '--maxmemory-policy',
                'volatile-lru',
            ]
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

configs:
    teme-database:
        file: ./postgres/initdb.d/10-teme-role.sh

secrets:
    app_key:
        file: ./secrets/app_key
    db_password:
        file: ./secrets/db_password
    postgres_password:
        file: ./secrets/postgres_password
    github_token:
        file: ./secrets/github_token

volumes:
    pgdata:
    media:
    page-cache:
    extensions:
