# Traefik in front of Teme's web role, for a server that has no platform in
# front of it (docs/guides/operators/platforms/plain-vps.md). Switch it on in
# .env with COMPOSE_FILE=compose.yml:compose.proxy.yml, and set TEME_HOST (the
# site's host name) and TEME_ACME_EMAIL (where Let's Encrypt writes about the
# certificate). Traefik believes no forwarded header until the Cloudflare page
# of the guide adds Cloudflare's ranges to websecure.
name: teme

services:
    traefik:
        image: traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
        command:
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
            - --providers.docker=true
            - --providers.docker.exposedByDefault=false
            - --entryPoints.web.address=:80
            - --entryPoints.web.http.redirections.entryPoint.to=websecure
            - --entryPoints.web.http.redirections.entryPoint.scheme=https
            - --entryPoints.websecure.address=:443
            - --certificatesResolvers.letsencrypt.acme.email=${TEME_ACME_EMAIL:?Set TEME_ACME_EMAIL in .env to an address Let's Encrypt may write to}
            - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
            - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
            - --ping=true
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik-certificates:/letsencrypt
        healthcheck:
            test: ['CMD', 'traefik', 'healthcheck', '--ping']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    web:
        labels:
            traefik.enable: 'true'
            traefik.http.routers.teme.rule: "Host(`${TEME_HOST:?Set TEME_HOST in .env to the site's host name, such as example.com}`)"
            traefik.http.routers.teme.entrypoints: websecure
            traefik.http.routers.teme.tls.certresolver: letsencrypt
            traefik.http.services.teme.loadbalancer.server.port: '8080'

volumes:
    traefik-certificates:
