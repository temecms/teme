# The Dokploy version of docker/compose.yml: one Compose service with its
# own PostgreSQL. Tested locally and on Dokploy v0.31.0.
# Paste into Dokploy: Create Service > Compose > Raw. Compose type: Docker Compose.
# Passwords come from the service's Environment tab instead of secret files:
# TEME_IMAGE, APP_URL, APP_KEY, DB_PASSWORD, POSTGRES_PASSWORD, TEME_GITHUB_TOKEN.
# Updating from the admin (I-3333) adds TEME_UPDATER_IMAGE (the same image as
# TEME_IMAGE), TEME_IMAGE_REPOSITORY, TEME_DOKPLOY_URL, TEME_DOKPLOY_TOKEN and
# TEME_DOKPLOY_COMPOSE_ID; only the updater service names the last three.
# teme-db-setup makes Teme's own limited login (teme_app) and both databases
# on every deploy, instead of the recipe's initdb script (I-379).
name: teme

x-teme-environment: &teme-environment
    APP_URL: ${APP_URL}
    APP_KEY: ${APP_KEY}
    DB_HOST: teme-postgres
    DB_PORT: '5432'
    DB_DATABASE: teme_site
    DB_USERNAME: teme_app
    DB_PASSWORD: ${DB_PASSWORD}
    TEME_VERIFY_DATABASE: teme_verify
    PAGE_CACHE_DRIVER: static
    PGCONNECT_TIMEOUT: '3'
    TEME_IMAGE_REPOSITORY: ${TEME_IMAGE_REPOSITORY:-}
    # Media in object storage (docs/guides/operators/object-storage.md); every
    # part reads the same disks, or a worker writes where web doesn't read.
    MEDIA_STORAGE: ${MEDIA_STORAGE:-server}
    MEDIA_DISK: ${MEDIA_DISK:-}
    MEDIA_ORIGINALS_DISK: ${MEDIA_ORIGINALS_DISK:-}
    MEDIA_URL: ${MEDIA_URL:-}
    MEDIA_BUCKET: ${MEDIA_BUCKET:-}
    MEDIA_ORIGINALS_BUCKET: ${MEDIA_ORIGINALS_BUCKET:-}
    MEDIA_BUCKET_ROOT: ${MEDIA_BUCKET_ROOT:-}
    MEDIA_ORIGINALS_BUCKET_ROOT: ${MEDIA_ORIGINALS_BUCKET_ROOT:-}
    MEDIA_BUCKET_ENDPOINT: ${MEDIA_BUCKET_ENDPOINT:-}
    MEDIA_BUCKET_REGION: ${MEDIA_BUCKET_REGION:-}
    MEDIA_BUCKET_PATH_STYLE: ${MEDIA_BUCKET_PATH_STYLE:-}
    MEDIA_BUCKET_ACCESS_KEY_ID: ${MEDIA_BUCKET_ACCESS_KEY_ID:-}
    MEDIA_BUCKET_SECRET_ACCESS_KEY: ${MEDIA_BUCKET_SECRET_ACCESS_KEY:-}
    MEDIA_BUCKET_URL: ${MEDIA_BUCKET_URL:-}
    MEDIA_BUCKET_ACL: ${MEDIA_BUCKET_ACL:-}

x-teme: &teme
    image: ${TEME_IMAGE}
    environment: *teme-environment
    volumes:
        - media:/var/www/html/storage/app
        - page-cache:/var/www/html/storage/page-cache
    networks:
        - default
    restart: unless-stopped

services:
    teme-postgres:
        image: postgres:18.6-trixie
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '--host',
                    '127.0.0.1',
                    '--username',
                    'postgres',
                    '--dbname',
                    'postgres',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        stop_grace_period: 1m
        networks:
            - default
        restart: unless-stopped
        deploy:
            resources:
                limits: { cpus: '1', memory: 1g }

    # Makes Teme's own limited login and its two databases, and sets the
    # login's password to DB_PASSWORD, on every deploy; safe to run again.
    teme-db-setup:
        image: postgres:18.6-trixie
        environment:
            PGPASSWORD: ${POSTGRES_PASSWORD}
            TEME_DB_PASSWORD: ${DB_PASSWORD}
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
                psql -v ON_ERROR_STOP=1 --no-psqlrc -h teme-postgres -U postgres -d postgres <<'SQL'
                \getenv teme_password TEME_DB_PASSWORD
                SELECT 'CREATE ROLE teme_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'teme_app') \gexec
                ALTER ROLE teme_app PASSWORD :'teme_password';
                SELECT 'CREATE DATABASE teme_site OWNER teme_app TEMPLATE template0 ENCODING ''UTF8''' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'teme_site') \gexec
                SELECT 'CREATE DATABASE teme_verify OWNER teme_app TEMPLATE template0 ENCODING ''UTF8''' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'teme_verify') \gexec
                REVOKE ALL ON DATABASE teme_site FROM PUBLIC;
                REVOKE ALL ON DATABASE teme_verify FROM PUBLIC;
                SQL
        restart: 'no'
        networks:
            - default
        depends_on:
            teme-postgres:
                condition: service_healthy

    # Migrates under a lock, then exits; every other part waits for it.
    deploy:
        <<: *teme
        command: ['php', 'artisan', 'teme:deploy']
        init: true
        restart: 'no'
        healthcheck:
            disable: true
        depends_on:
            teme-db-setup:
                condition: service_completed_successfully

    web:
        <<: *teme
        networks:
            - default
            - dokploy-network
        depends_on:
            deploy:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '1', memory: 1g }

    worker:
        <<: *teme
        command:
            ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
        init: true
        stop_grace_period: 6m
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s
        depends_on:
            deploy:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 512m }

    worker-long:
        <<: *teme
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'database-long',
                '--queue=long',
                '--tries=3',
                '--max-time=3600',
            ]
        init: true
        stop_grace_period: 6m
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s
        depends_on:
            deploy:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 512m }

    scheduler:
        <<: *teme
        command: ['php', 'artisan', 'schedule:work']
        init: true
        stop_grace_period: 30m
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s
        environment:
            <<: *teme-environment
            TEME_GITHUB_TOKEN: ${TEME_GITHUB_TOKEN}
        depends_on:
            deploy:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '0.25', memory: 256m }

    # Carries out an update asked for from the admin (I-3326): sets TEME_IMAGE
    # through Dokploy's API and deploys this Compose service. Its own image is
    # TEME_UPDATER_IMAGE, so the update it runs never replaces it midway.
    updater:
        image: ${TEME_UPDATER_IMAGE:?set TEME_UPDATER_IMAGE to the same image as TEME_IMAGE}
        command: ['php', 'artisan', 'teme:updater']
        init: true
        stop_grace_period: 1m
        healthcheck:
            disable: true
        environment:
            <<: *teme-environment
            TEME_GITHUB_TOKEN: ${TEME_GITHUB_TOKEN}
            TEME_UPDATER_PLATFORM: dokploy
            TEME_DOKPLOY_URL: ${TEME_DOKPLOY_URL:-}
            TEME_DOKPLOY_TOKEN: ${TEME_DOKPLOY_TOKEN:-}
            TEME_DOKPLOY_COMPOSE_ID: ${TEME_DOKPLOY_COMPOSE_ID:-}
        networks:
            - default
        restart: unless-stopped
        depends_on:
            deploy:
                condition: service_completed_successfully
        deploy:
            resources:
                limits: { cpus: '0.25', memory: 256m }

networks:
    dokploy-network:
        external: true

volumes:
    pgdata:
    media:
    page-cache:
