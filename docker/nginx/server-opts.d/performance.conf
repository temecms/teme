# Replaces serversideup/php's performance.conf (I-420). A year's immutable
# caching only for files whose address changes when their content does;
# gzip for text, with Brotli and zstd left to a CDN in front.

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    log_not_found off;
    access_log off;
    try_files $uri /index.php?$query_string;
}

# Vite's hashed build files: the admin's, and each theme's.
location ~ ^/(?:build|themes/[^/]+/build)/assets/ {
    add_header_inherit merge;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Media variants, under their item's ID and file version (StorageKeys).
# Quoted: nginx reads an unquoted { in a pattern as the start of a block.
location ~ "^/storage/media/[0-9A-Z]{26}/v[0-9]+/" {
    add_header_inherit merge;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/xsl text/csv text/javascript application/javascript application/json application/manifest+json application/xml application/xslt+xml application/rss+xml application/atom+xml image/svg+xml;
