# Replaces serversideup/php's security.conf. Its three headers are
# kept, added only where PHP sent none (conf.d/teme-edge.conf). Its
# Strict-Transport-Security, sent on every answer with includeSubDomains,
# is not: nginx sends TEME_HSTS's value with the answers it gives itself,
# over https only, as Teme does with its own (conf.d/teme-hsts.conf).

add_header X-Frame-Options           $teme_x_frame_options always;
add_header X-Content-Type-Options    $teme_x_content_type_options always;
add_header Referrer-Policy           $teme_referrer_policy always;
add_header Strict-Transport-Security $teme_hsts always;

# The image's file rules, as it wrote them: no dotfile but /.well-known/,
# and no backup, configuration, log or script file, is ever served.
location ~ /\.(?!well-known) {
    deny all;
}

location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
