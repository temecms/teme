# nginx never rewrites the connection's address: the image's trusted-proxy
# file is off (TRUSTED_PROXY=off), and this file, which replaced the
# image's remoteip.conf before v5, stays empty. The image's file believed CF-Connecting-IP from
# Docker's and Cloudflare's ranges, so a client reaching the proxy directly
# could choose the address PHP sees. Teme alone decides who the reader is,
# from X-Forwarded-For and TRUSTED_PROXIES.
