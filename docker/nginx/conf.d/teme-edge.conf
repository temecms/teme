# Teme's edge (I-380), read inside http {}: the security headers nginx adds
# to an answer only when PHP sent none, so PHP's own (the admin's DENY, a
# stricter referrer policy) are never doubled, and a file nginx serves
# itself carries what a page from PHP would. The values are the image's
# own. server-opts.d/security.conf sends them; the start step writes the
# Strict-Transport-Security map beside this, as teme-hsts.conf.

map $upstream_http_x_frame_options $teme_x_frame_options {
    ""      "SAMEORIGIN";
    default "";
}

map $upstream_http_x_content_type_options $teme_x_content_type_options {
    ""      "nosniff";
    default "";
}

map $upstream_http_referrer_policy $teme_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
