# Teme's static-file page cache, for serversideup/php
# 4.5.1's fpm-nginx image: copy this file to /etc/nginx/conf.d/, which the
# image's nginx.conf includes inside http {}. It decides, for each request,
# which file in the page cache's static folder may answer it: only a GET or
# HEAD, with no query, from a browser that carries no teme_auth marker, at
# an address the router doesn't keep for itself. Anything else looks for
# /.teme-none, which never exists, and reaches PHP as before. The site's
# rules are site-opts.d/http.conf.template beside this.
# Held in step with the code by tests/Feature/Cache/StaticSettingsTest.php.

# A signed-in browser: the teme_auth cookie there at all, whatever its
# value, as PHP reads it (SignedInMarker::present()).
map $http_cookie $teme_signed_in {
    "~(^|;\s*)teme_auth=" 1;
    default 0;
}

# The addresses the router answers itself (Paths::RESERVED).
map $uri $teme_reserved {
    "~^/(admin|preview|up|storage|build|_teme)(/|$)" 1;
    default 0;
}

# The file for the address: the path as nginx decoded and normalised it,
# and index.html, so /about/ is about/index.html and /about is
# aboutindex.html: the name keeps the path's case and its trailing slash.
map "$request_method:$args:$teme_signed_in:$teme_reserved" $teme_static_page {
    "GET::0:0"  "${uri}index.html";
    "HEAD::0:0" "${uri}index.html";
    default     "/.teme-none";
}

# A fediverse server asking for a document gets PHP's answer, never a
# stored page.
map $http_accept $teme_static_file {
    "~*(activity\+json|ld\+json)" "/.teme-none";
    default $teme_static_page;
}
