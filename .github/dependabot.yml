version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Composer and npm: a weekly look, minor and patch releases grouped into one
  # pull request each, a major release on its own because it needs planning.
  # The pull requests are signals, never merged on GitHub: each is triaged
  # like an issue, the builder applies the update locally through the full
  # gate, and Dependabot closes its pull request once main has the new
  # version (I-455, I-456).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      composer-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-major-days: 14
    # Node's types follow the runtime in .nvmrc, never ahead of it; they
    # move by hand when .nvmrc does.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
