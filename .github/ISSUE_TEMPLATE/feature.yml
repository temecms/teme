name: Feature request
description: Something Teme should do that it doesn't yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [the roadmap](https://github.com/temecms/teme/blob/main/docs/roadmap.md) and the open issues first: it may already be planned.
        Many features belong in a plugin or a theme rather than in Teme itself. If a plugin can't do what you need because Teme lacks a hook or a place to plug in, say so: that is a feature request for Teme.
  - type: textarea
    id: problem
    attributes:
      label: What it is for
      description: The problem you or your editors have today, in a sentence or two. Not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the point of view of the person using it.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it belongs, in your view
      options:
        - In Teme itself (every site needs it)
        - In a plugin (some sites need it), with something Teme must add for it
        - In a theme (it is about the look)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How others do it
      description: Another system or plugin that does this well, if you know one, with a link or a screenshot.
