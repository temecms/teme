# Gives a pull request its area labels from the files it changes, by the
# map in .github/labeler.yml. The action reads the map from the base branch
# and never checks out or runs the pull request's code, which is what makes
# pull_request_target safe here.
name: Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
